name: Nightly DrugMaster Database Update

on:
  schedule:
    # Runs at 00:00 UTC (around 5:30 AM IST) every night
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to click a "Run" button manually in GitHub

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Latest SQLite from Google Sheets
        run: python scripts/build_drug_db.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "Nightly Bot"
          git config --global user.email "bot@clinicalcompanion.local"
          git add assets/clinical_drugs.sqlite
          git commit -m "chore: nightly drug master sync from Google Sheets" || echo "No changes to commit"
          git push