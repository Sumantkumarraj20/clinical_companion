name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode --ignore-garbage > android/app/release.keystore
          test -s android/app/release.keystore || {
            echo "::error::RELEASE_KEYSTORE secret is empty or did not decode to a non-empty file."
            exit 1
          }
        shell: bash

      - name: Verify release keystore
        run: |
          keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -alias "${{ vars.RELEASE_KEY_ALIAS || 'release' }}" \
            > /tmp/keystore-info.txt
          echo "Signing certificate SHA-256:"
          grep -i "SHA256:" /tmp/keystore-info.txt || true
        shell: bash

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-v1

      - name: Build Android APK (with Network Retry)
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            echo "Attempt $((n+1)) of 3..."
            flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}" && break
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Build failed after 3 attempts due to network/compilation errors."
              exit 1
            fi
            echo "Network flake detected. Retrying in 15 seconds..."
            sleep 15
          done
        env:
          SIGNING_KEY_PATH: ${{ github.workspace }}/android/app/release.keystore
          SIGNING_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS || 'release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        shell: bash

      - name: Verify APK signature
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "Verifying: $APK"
          KS_FP=$(keytool -list -v \
              -keystore android/app/release.keystore \
              -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              -alias "${{ vars.RELEASE_KEY_ALIAS || 'release' }}" 2>/dev/null \
            | grep -i 'SHA256:' | head -n 1 | tr -d ':' | awk '{print tolower($2)}')
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -n 1 | awk '{print tolower($NF)}')
          echo "keystore SHA-256 : ${KS_FP:-<unreadable>}"
          echo "apk     SHA-256 : ${APK_FP:-<unreadable>}"
          if [ -z "$KS_FP" ] || [ -z "$APK_FP" ]; then
            echo "::error::Could not read a signing fingerprint. Refusing to publish an APK we cannot prove the identity of."
            exit 1
          fi

          if [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::APK was NOT signed with the release keystore. Publishing it would break every in-place update ('package conflicts with an existing package')."
            exit 1
          fi
          echo "OK: APK signer matches the release keystore (in-place updates will work)."
        shell: bash

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClinCom ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
