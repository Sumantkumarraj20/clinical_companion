name: Linux Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-linux:
    name: Build & Release Linux Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: |
          VERSION_NAME=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 2 | tr -d '[:space:]')
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -le 1 ]; then
            echo "pubspec.yaml version must be MAJOR.MINOR.PATCH+BUILD with BUILD > 1." >&2
            exit 1
          fi
          echo "Building versionName=$VERSION_NAME build=$BUILD_NUMBER"
          flutter build linux --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"
        shell: bash

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/clinical-companion-linux.zip" .
        shell: bash

      - name: Publish Linux Bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClinCom ${{ github.ref_name }}
          files: clinical-companion-linux.zip
