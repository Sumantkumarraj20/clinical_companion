name: Build & Release

on:
  push:
    tags:
      - 'v*'

# Required so the release step can create releases and upload assets.
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode --ignore-garbage > android/app/release.keystore
          test -s android/app/release.keystore || {
            echo "::error::RELEASE_KEYSTORE secret is empty or did not decode to a non-empty file."
            exit 1
          }
        shell: bash

      - name: Verify release keystore
        run: |
          keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -alias "${{ vars.RELEASE_KEY_ALIAS || 'release' }}" \
            > /tmp/keystore-info.txt
          echo "Signing certificate SHA-256:"
          grep -i "SHA256:" /tmp/keystore-info.txt || true
        shell: bash

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-v1

      - name: Build release APK
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"
        env:
          SIGNING_KEY_PATH: ${{ github.workspace }}/android/app/release.keystore
          SIGNING_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS || 'release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        shell: bash

      - name: Verify APK signature
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "Verifying: $APK"
          KS_FP=$(keytool -list -v \
              -keystore android/app/release.keystore \
              -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              -alias "${{ vars.RELEASE_KEY_ALIAS || 'release' }}" 2>/dev/null \
            | grep -i 'SHA256:' | head -n 1 | tr -d ':' | awk '{print tolower($2)}')
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -n 1 | awk '{print tolower($NF)}')
          echo "keystore SHA-256 : ${KS_FP:-<unreadable>}"
          echo "apk     SHA-256 : ${APK_FP:-<unreadable>}"
          if [ -z "$KS_FP" ] || [ -z "$APK_FP" ]; then
            echo "::error::Could not read a signing fingerprint. Refusing to publish an APK we cannot prove the identity of."
            exit 1
          fi

          if [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::APK was NOT signed with the release keystore. Publishing it would break every in-place update ('package conflicts with an existing package')."
            exit 1
          fi
          echo "OK: APK signer matches the release keystore (in-place updates will work)."
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: |
          flutter build linux --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"
        shell: bash

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/clinical-companion-linux.zip" .
        shell: bash

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: clinical-companion-linux.zip
          path: clinical-companion-linux.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          flutter build windows --release `
            "--build-name=$version" `
            "--build-number=${{ github.run_number }}"

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "clinical-companion-windows.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: clinical-companion-windows.zip
          path: clinical-companion-windows.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-windows]
    if: always()
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release.apk
          path: release-assets

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: clinical-companion-linux.zip
          path: release-assets

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: clinical-companion-windows.zip
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClinCom ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/app-release.apk
            release-assets/clinical-companion-linux.zip
            release-assets/clinical-companion-windows.zip
