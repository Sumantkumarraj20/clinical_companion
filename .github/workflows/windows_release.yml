name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Release Windows Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml | Select-String "^version: " | Select-Object -First 1
          $versionString = $pubspec.Line -replace "^version: ", "" -replace "\s", ""
          $VERSION_NAME = $versionString.Split('+')[0]
          $BUILD_NUMBER = $versionString.Split('+')[1]
          if ($VERSION_NAME -notmatch '^\d+\.\d+\.\d+$' -or $BUILD_NUMBER -notmatch '^\d+$' -or [int]$BUILD_NUMBER -le 1) {
            Write-Error "pubspec.yaml version must be MAJOR.MINOR.PATCH+BUILD with BUILD > 1."
            exit 1
          }
          Write-Host "Building version=$VERSION_NAME build=$BUILD_NUMBER"
          flutter build windows --release "--build-name=$VERSION_NAME" "--build-number=$BUILD_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "clinical-companion-windows.zip" `
            -CompressionLevel Optimal

      - name: Publish Windows Bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClinCom ${{ github.ref_name }}
          files: clinical-companion-windows.zip
