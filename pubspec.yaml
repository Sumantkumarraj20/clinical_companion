name: clinical_companion
description: Offline-first personal clinical assistant for Android and web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.8.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  encrypt: ^5.0.3
  file_picker: ^10.2.0
  flutter_speed_dial: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  supabase_flutter: ^2.17.2
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  csv: ^8.0.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_markdown: ^0.7.7+1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  http: ^1.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.9.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/clinical_drugs.sqlite
    - assets/pmjay_hbp.sqlite

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  
  # Optional: Configure Android Adaptive Icons (Required for Android 8.0+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
