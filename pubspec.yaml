name: clinical_companion
description: Offline-first personal clinical assistant for Android and web.
publish_to: "none"
# release.sh increments this version and tags the matching MAJOR.MINOR.PATCH.
# Android's versionCode is the number after "+", and it must strictly increase
# for every shipped APK or the package installer refuses the upgrade.
# It also feeds the in-app updater, which compares this value against the
# latest GitHub release tag — a mismatch makes it offer the same update forever.
version: 1.0.13+13

environment:
  sdk: "^3.8.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  encrypt: ^5.0.3
  file_picker: ^10.2.0
  flutter_speed_dial: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  dio: ^5.11.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  supabase_flutter: ^2.17.2
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  csv: ^8.0.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_markdown: ^0.7.7+1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  # Sprint 27 — the google_generative_ai package only speaks the deprecated
  # generateContent API. The GA Interactions API is called over raw HTTP
  # (lib/core/ai/interactions_api_client.dart) via `http` below.
  image_picker: ^1.2.3
  photo_view: ^0.15.0
  http: ^1.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web: ^1.1.1
  google_mlkit_text_recognition: ^0.17.1
  # Real SemVer precedence for comparing the installed build against the
  # published GitHub tag, so `1.0.10 > 1.0.9` and a pre-release tag such as
  # `v1.1.0-beta.1` correctly sorts BELOW `1.1.0`.
  pub_semver: ^2.2.0
  open_filex: ^4.7.0
    # SHA-256 content hashing of scanned documents, so re-photographing the same
  # physical page can never create a second record (Sprint 17).
  crypto: ^3.0.6

  flutter_image_compress: ^2.5.1
  package_info_plus: ^9.0.1
  # DatabaseBackupService opens a *candidate* backup on its own connection to
  # verify it really is an app database before the live one is overwritten.
  # Transitive via drift, but a direct runtime dependency now.
  sqlite3: ^3.5.2
  speech_to_text: ^7.5.0
  pdf_render_maintained: ^1.6.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Sprint 17.5 — real-device / live-Supabase verification suite.
  integration_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.9.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/clinical_drugs.sqlite
    - assets/pmjay_hbp.sqlite

flutter_launcher_icons:
  # Sprint 17.6 — the ClinCom icon on every desktop AND mobile platform.
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

  # NOTE: flutter_launcher_icons 0.14.x has no `linux:` generator, and an
  # unrecognised key makes the tool fall back to defaults and fail. The Linux
  # icon is therefore written directly — see linux/runner/ClinCom icons.

  # Android adaptive icon: flat background + ClinCom mark as the foreground.
  # The background MUST be flat — Android applies its own mask, so a
  # full-bleed foreground renders as an oversized, blurry glyph.
  adaptive_icon_background: "#0d6b61"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
